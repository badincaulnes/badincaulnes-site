<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>BadinCaulnes — Direction B · Communauté & éditorial</title>
<meta name="viewport" content="width=1440" />
<link rel="stylesheet" href="../ds/colors_and_type.css" />
<link rel="stylesheet" href="../ds/components.css" />
<link rel="stylesheet" href="../ds/icons.css" />
<link rel="stylesheet" href="../ds/badincaulnes.css" />
<link rel="stylesheet" href="../ds/brand.css" />
<style>
  /* Direction B — éditorial, communauté, palette BadinCaulnes */
  :root{
    --b-bg: #ffffff;
    --b-paper: #f6f4ee;          /* warm cream */
    --b-rule: var(--bc-navy);    /* navy rules */
    --b-ink: var(--bc-navy-deep);
    --b-deep: var(--bc-navy);
    --b-accent: var(--bc-teal);  /* link/accent teal */
    --b-accent-2: var(--bc-lime);
  }
  body{ background: var(--b-bg); color: var(--ods-theme-text-color); font-feature-settings: "kern", "liga"; }
  .b-app{ width:1440px; }

  /* ── Top bar — masthead style ───────────────────── */
  .b-topbar{
    border-bottom: 1px solid var(--b-rule);
    background: #fff;
    position: sticky; top: 0; z-index: 40;
  }
  .b-mast{
    display:grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 16px 40px 12px;
  }
  .b-mast-meta{ font: 600 11px var(--ods-theme-font-family); letter-spacing: .14em; text-transform: uppercase; color: var(--ods-color-neutral-700); }
  .b-mast-meta--right{ text-align: right; color: var(--b-deep); }
  .b-mast-logo{
    display:flex; align-items:center; gap: 10px; justify-self: center;
    cursor: pointer;
  }
  .b-mast-logo-name{ font: 800 28px/1 var(--ods-theme-font-family); letter-spacing: -.02em; color: var(--ods-color-primary-800); }
  .b-mast-logo-sub{ display:block; font: 600 10px var(--ods-theme-font-family); letter-spacing: .22em; text-transform: uppercase; color: var(--ods-color-neutral-600); margin-top: 2px; text-align: center; }
  .b-mast-mark{
    width: 44px; height: 44px;
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink: 0;
  }
  .b-mast-mark img{ width: 100%; height: 100%; object-fit: contain; }
  .b-nav{
    display:flex; justify-content: center; gap: 32px;
    padding: 12px 40px;
    border-top: 1px solid var(--ods-color-neutral-100);
  }
  .b-nav button{
    border: 0; background: transparent;
    padding: 4px 0;
    font: 600 13px var(--ods-theme-font-family);
    color: var(--ods-color-primary-800); cursor: pointer;
    letter-spacing: .04em; text-transform: uppercase;
    position: relative;
  }
  .b-nav button:hover{ color: var(--b-accent); }
  .b-nav button[aria-current="page"]::after{
    content:""; position:absolute; bottom: -13px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 6px; background: var(--b-accent); border-radius: 50%;
  }

  /* ── Section base ───────────────────────────────── */
  .b-section{ padding: 80px 80px; max-width: 1440px; }
  .b-section--narrow{ padding: 80px 200px; }
  .b-section--paper{ background: var(--b-paper); }
  .b-eyebrow-b{
    font: 700 11px var(--ods-theme-font-family);
    text-transform: uppercase; letter-spacing: .2em;
    color: var(--b-accent);
    display: flex; align-items: center; gap: 12px;
  }
  .b-eyebrow-b::after{ content:""; flex: 1; height: 1px; background: var(--ods-color-neutral-200); }
  .b-display{
    font: 800 56px/1.04 var(--ods-theme-font-family);
    letter-spacing: -.022em;
    color: var(--ods-color-primary-800);
  }
  .b-lead{
    font: 400 18px/1.6 var(--ods-theme-font-family);
    color: var(--ods-color-neutral-700);
    max-width: 640px;
  }
  .b-drop::first-letter{
    float: left;
    font: 800 64px/0.9 var(--ods-theme-font-family);
    color: var(--b-deep);
    padding: 4px 10px 0 0;
    letter-spacing: -.04em;
  }

  /* ── Hero ───────────────────────────────────────── */
  .b-hero{
    display:grid; grid-template-columns: 1.05fr 1fr; gap: 64px;
    padding: 80px 80px 60px;
    align-items: flex-start;
  }
  .b-hero-meta{
    display:flex; align-items: center; gap: 16px;
    font: 600 11px var(--ods-theme-font-family); letter-spacing: .2em; text-transform: uppercase;
    color: var(--ods-color-neutral-600);
    margin-bottom: 24px;
  }
  .b-hero-meta-num{ background: var(--ods-color-primary-700); color:#fff; padding: 4px 10px; letter-spacing: .14em; }
  .b-hero h1{ font: 800 76px/1.0 var(--ods-theme-font-family); letter-spacing: -.028em; color: var(--ods-color-primary-800); }
  .b-hero h1 em{ font-style: italic; color: var(--b-accent); font-weight: 400; font-family: 'Source Sans Pro', serif; }
  .b-hero-lead{ font: 400 19px/1.6 var(--ods-theme-font-family); margin-top: 24px; color: var(--ods-color-neutral-700); max-width: 520px; }
  .b-hero-ctas{ display:flex; gap: 16px; margin-top: 32px; align-items: center; }
  .b-hero-byline{
    margin-top: 56px; padding-top: 20px;
    border-top: 1px solid var(--ods-color-neutral-200);
    display: flex; gap: 24px; align-items: center;
  }
  .b-byline-av{
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--ods-color-primary-100); color: var(--b-deep);
    display:inline-flex; align-items:center; justify-content:center;
    font: 800 14px var(--ods-theme-font-family);
  }
  .b-byline-meta{ font-size: 13px; color: var(--ods-color-neutral-600); line-height: 1.5; }
  .b-byline-meta b{ color: var(--ods-color-primary-800); font-weight: 700; }

  .b-hero-art{
    position: relative;
    height: 580px;
    border-radius: 4px; overflow: hidden;
  }
  .b-hero-art .b-caption{
    position: absolute; left: 0; bottom: -32px;
    font: italic 12px var(--ods-theme-font-family); color: var(--ods-color-neutral-600);
    max-width: 100%;
  }

  /* ── Numéro / dates ─────────────────────────────── */
  .b-issue{
    border-top: 2px solid var(--b-rule);
    padding-top: 12px;
    display:flex; justify-content: space-between; align-items: baseline;
    font: 600 11px var(--ods-theme-font-family); letter-spacing: .2em; text-transform: uppercase;
    color: var(--ods-color-neutral-600);
    margin: 0 80px;
  }

  /* ── News editorial grid ────────────────────────── */
  .b-articles{ display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 56px; }
  .b-article{ display:flex; flex-direction: column; gap: 12px; }
  .b-article__photo{ height: 280px; border-radius: 2px; overflow: hidden; }
  .b-article--feature .b-article__photo{ height: 420px; }
  .b-article__cat{
    font: 700 11px var(--ods-theme-font-family); letter-spacing: .18em; text-transform: uppercase;
  }
  .b-article__cat--primary{ color: var(--b-accent); }
  .b-article__cat--info   { color: var(--b-deep); }
  .b-article__cat--success{ color: var(--ods-color-success-700); }
  .b-article__cat--warning{ color: var(--ods-color-warning-700); }
  .b-article__title{
    font: 700 22px/1.22 var(--ods-theme-font-family);
    color: var(--ods-color-primary-800);
    letter-spacing: -.01em;
  }
  .b-article--feature .b-article__title{ font-size: 36px; line-height: 1.12; font-weight: 800; }
  .b-article__excerpt{ font-size: 15px; line-height: 1.55; color: var(--ods-color-neutral-700); }
  .b-article__byline{ font: italic 12px var(--ods-theme-font-family); color: var(--ods-color-neutral-600); }
  .b-article__cat + .b-article__title{ margin-top: 4px; }

  /* ── Carnet (events timeline) ───────────────────── */
  .b-carnet{ display:grid; grid-template-columns: 0.9fr 1.6fr; gap: 80px; }
  .b-carnet-list{ display:flex; flex-direction: column; }
  .b-carnet-item{
    display:grid; grid-template-columns: 80px 1fr auto; gap: 32px;
    padding: 24px 0;
    border-top: 1px solid var(--ods-color-neutral-200);
    align-items: flex-start;
  }
  .b-carnet-item:last-child{ border-bottom: 1px solid var(--ods-color-neutral-200); }
  .b-carnet-item:hover{ background: var(--b-paper); }
  .b-carnet-date{
    font: 800 36px/1 var(--ods-theme-font-family); letter-spacing: -.02em;
    color: var(--ods-color-primary-800);
  }
  .b-carnet-date small{
    display:block; font: 600 11px var(--ods-theme-font-family);
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--ods-color-neutral-600); margin-top: 4px;
  }
  .b-carnet-info h3{ font: 700 19px/1.3 var(--ods-theme-font-family); color: var(--ods-color-primary-800); margin-bottom: 4px; }
  .b-carnet-info .meta{ font: italic 13px var(--ods-theme-font-family); color: var(--ods-color-neutral-600); margin-bottom: 8px; }
  .b-carnet-info p{ font-size: 14px; line-height: 1.55; color: var(--ods-color-neutral-700); }
  .b-carnet-kind{
    font: 600 11px var(--ods-theme-font-family); letter-spacing: .14em; text-transform: uppercase;
    color: var(--ods-color-neutral-700);
    border: 1px solid var(--ods-color-neutral-300);
    padding: 4px 10px; border-radius: 999px;
    white-space: nowrap;
  }

  /* ── Quote ──────────────────────────────────────── */
  .b-quote-wrap{ display: grid; grid-template-columns: 1fr 1.4fr; gap: 64px; align-items: center; }
  .b-quote{
    font: 400 36px/1.3 var(--ods-theme-font-family);
    color: var(--ods-color-primary-800);
    letter-spacing: -.012em;
    position: relative;
    padding-left: 0;
  }
  .b-quote::before{
    content: "“"; position: absolute; top: -40px; left: -8px;
    font: 800 96px/1 var(--ods-theme-font-family);
    color: var(--b-accent);
  }
  .b-quote em{ font-style: italic; color: var(--b-accent); }
  .b-quote-attribution{ margin-top: 24px; font: 600 13px var(--ods-theme-font-family); letter-spacing: .04em; color: var(--ods-color-neutral-700); }
  .b-quote-attribution span{ color: var(--ods-color-neutral-500); font-weight: 400; }

  /* ── Pricing ─────────────────────────────────────── */
  .b-pricing{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 2px solid var(--b-rule); }
  .b-price{
    padding: 32px 28px;
    display:flex; flex-direction: column; gap: 16px;
    border-right: 1px solid var(--ods-color-neutral-200);
    background: #fff;
    position: relative;
  }
  .b-price:last-child{ border-right: 0; }
  .b-price--featured{ background: var(--b-paper); }
  .b-price h3{ font-size: 22px; letter-spacing: -.01em; }
  .b-price .sub{ font: italic 13px var(--ods-theme-font-family); color: var(--ods-color-neutral-600); }
  .b-price .price{ font: 800 52px/1 var(--ods-theme-font-family); letter-spacing: -.025em; color: var(--ods-color-primary-800); }
  .b-price .price small{ font-size: 13px; font-weight: 600; color: var(--ods-color-neutral-500); letter-spacing: 0; }
  .b-price .perk{ display:flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: var(--ods-color-neutral-700); }
  .b-price .perk::before{
    content: ""; flex: 0 0 auto;
    width: 14px; height: 14px;
    margin-top: 4px;
    background: currentColor;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3 8l3 3 7-7' stroke='black' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3 8l3 3 7-7' stroke='black' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/contain no-repeat;
    color: var(--b-accent);
  }
  .b-price-ribbon{ position:absolute; top: -2px; left: 28px; right: 28px; height: 2px; background: var(--b-accent); }
  .b-price-tag{
    position: absolute; top: 18px; right: 18px;
    font: 600 10px var(--ods-theme-font-family); letter-spacing: .2em; text-transform: uppercase;
    color: var(--b-accent);
  }

  /* ── Team ───────────────────────────────────────── */
  .b-team{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 56px 48px; }
  .b-team-card{
    display:grid; grid-template-columns: 96px 1fr; gap: 20px;
    align-items: flex-start;
  }
  .b-team-av{
    width: 96px; height: 96px; border-radius: 50%;
    background: var(--ods-color-primary-100); color: var(--b-deep);
    display:flex; align-items:center; justify-content:center;
    font: 800 30px var(--ods-theme-font-family);
  }
  .b-team-info h4{ font: 700 18px var(--ods-theme-font-family); color: var(--ods-color-primary-800); margin-bottom: 4px; }
  .b-team-role{ font: italic 14px var(--ods-theme-font-family); color: var(--b-accent); margin-bottom: 8px; }
  .b-team-since{ font-size: 12px; color: var(--ods-color-neutral-600); }

  /* ── Schedule (editorial table) ─────────────────── */
  .b-schedule{
    border-top: 2px solid var(--b-rule);
    border-bottom: 2px solid var(--b-rule);
  }
  .b-schedule-row{
    display:grid; grid-template-columns: 140px 160px 1fr 1fr 80px;
    gap: 24px; padding: 20px 0;
    border-bottom: 1px solid var(--ods-color-neutral-200);
    align-items: center;
  }
  .b-schedule-row:last-child{ border-bottom: 0; }
  .b-schedule-row:hover{ background: var(--b-paper); }
  .b-schedule-day{ font: 800 18px var(--ods-theme-font-family); color: var(--ods-color-primary-800); letter-spacing: -.01em; }
  .b-schedule-time{ font: 600 16px var(--ods-theme-font-family-code); color: var(--b-deep); font-variant-numeric: tabular-nums; }
  .b-schedule-level{ font-size: 15px; color: var(--ods-color-neutral-800); }
  .b-schedule-level em{ display:block; font: italic 12px var(--ods-theme-font-family); color: var(--ods-color-neutral-500); margin-top: 2px; font-style: italic; }
  .b-schedule-coach{ font: italic 13px var(--ods-theme-font-family); color: var(--ods-color-neutral-700); }
  .b-schedule-cat{
    font: 600 10px var(--ods-theme-font-family); letter-spacing: .14em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 2px;
    text-align: center;
  }
  .b-schedule-head{
    display:grid; grid-template-columns: 140px 160px 1fr 1fr 80px;
    gap: 24px; padding: 12px 0;
    border-bottom: 1px solid var(--ods-color-neutral-200);
    font: 700 10px var(--ods-theme-font-family); letter-spacing: .18em; text-transform: uppercase;
    color: var(--ods-color-neutral-500);
  }

  /* ── Gallery ────────────────────────────────────── */
  .b-gallery{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .b-gallery-tile{ aspect-ratio: 1; }
  .b-gallery-tile--tall{ aspect-ratio: 1/2; grid-row: span 2; }
  .b-gallery-tile--wide{ aspect-ratio: 2/1; grid-column: span 2; }

  /* ── Contact ────────────────────────────────────── */
  .b-contact-grid{ display:grid; grid-template-columns: 1.2fr 1fr; gap: 80px; }
  .b-contact-info-row{
    padding: 20px 0;
    border-bottom: 1px solid var(--ods-color-neutral-200);
    display: grid; grid-template-columns: 200px 1fr; gap: 32px;
    align-items: flex-start;
  }
  .b-contact-info-row:first-child{ border-top: 1px solid var(--ods-color-neutral-200); }
  .b-contact-info-label{
    font: 700 11px var(--ods-theme-font-family); letter-spacing: .18em; text-transform: uppercase;
    color: var(--ods-color-neutral-500);
    padding-top: 4px;
  }
  .b-contact-info-value{ font-size: 16px; color: var(--ods-color-primary-800); line-height: 1.5; }
  .b-contact-info-value a{ color: var(--b-deep); }

  /* ── Admin ──────────────────────────────────────── */
  .b-admin{ padding: 56px 80px; background: var(--b-paper); min-height: 800px; }
  .b-admin-shell{ display:grid; grid-template-columns: 240px 1fr; gap: 40px; }
  .b-admin-side{
    background: transparent;
    padding: 0;
  }
  .b-admin-side h4{
    font: 700 11px var(--ods-theme-font-family); letter-spacing: .18em; text-transform: uppercase;
    color: var(--ods-color-neutral-500); padding: 10px 0; margin-top: 12px;
    border-bottom: 1px solid var(--ods-color-neutral-200); margin-bottom: 4px;
  }
  .b-admin-side button{
    display:flex; align-items:center; gap: 10px; width:100%;
    padding: 10px 0; border:0; background: transparent;
    text-align:left; font: 600 14px var(--ods-theme-font-family); color: var(--ods-color-neutral-700); cursor:pointer;
    border-left: 2px solid transparent; padding-left: 12px; margin-left: -12px;
  }
  .b-admin-side button.is-active{ color: var(--b-deep); border-left-color: var(--b-accent); }
  .b-admin-side button:hover{ color: var(--b-deep); }
  .b-admin-main{
    background:#fff;
    border: 1px solid var(--ods-color-neutral-200);
    padding: 40px;
  }
  .b-formgrid{ display:grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  .b-formgrid .full{ grid-column: 1 / -1; }

  /* ── Footer ─────────────────────────────────────── */
  .b-footer{
    border-top: 2px solid var(--b-rule);
    padding: 56px 80px 24px;
    background: #fff;
  }
  .b-footer__grid{ display:grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 56px; padding-bottom: 40px; border-bottom: 1px solid var(--ods-color-neutral-200); }
  .b-footer h5{ color: var(--ods-color-primary-800); font: 700 11px var(--ods-theme-font-family); text-transform: uppercase; letter-spacing: .18em; margin-bottom: 16px; }
  .b-footer ul{ list-style: none; padding: 0; margin: 0; display:flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .b-footer a{ color: var(--ods-color-neutral-700); text-decoration: none; }
  .b-footer a:hover{ color: var(--b-accent); }
  .b-footer__strip{ display:flex; justify-content: space-between; padding-top: 16px; font-size: 12px; color: var(--ods-color-neutral-500); }

  /* ── Page hero (sub pages) ──────────────────────── */
  .b-page-hero{
    padding: 80px 80px 60px;
    border-bottom: 1px solid var(--ods-color-neutral-200);
  }
  .b-page-hero .crumb{ font: 600 11px var(--ods-theme-font-family); letter-spacing: .18em; text-transform: uppercase; color: var(--b-accent); }
  .b-page-hero h1{ font: 800 64px/1.04 var(--ods-theme-font-family); letter-spacing: -.025em; color: var(--ods-color-primary-800); margin-top: 16px; max-width: 900px; }
  .b-page-hero h1 em{ font-style: italic; color: var(--b-accent); font-weight: 400; }
  .b-page-hero p{ font: 400 19px/1.6 var(--ods-theme-font-family); margin-top: 20px; max-width: 720px; color: var(--ods-color-neutral-700); }

  /* ── Small UI bits ──────────────────────────────── */
  .b-pill{
    display:inline-flex; align-items:center; gap: 6px;
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--ods-color-neutral-300);
    font: 600 11px var(--ods-theme-font-family); letter-spacing: .12em; text-transform: uppercase;
    color: var(--ods-color-neutral-700); background: transparent; cursor:pointer;
  }
  .b-pill.is-active{ background: var(--ods-color-primary-700); color:#fff; border-color: transparent; }
  .b-pill:hover{ border-color: var(--b-accent); color: var(--b-deep); }

  .b-stat-num-light{
    font: 800 60px/1 var(--ods-theme-font-family);
    letter-spacing: -.025em;
    color: var(--b-deep);
    font-variant-numeric: tabular-nums;
  }

  .b-rule{ height: 2px; background: var(--b-rule); margin: 0 80px; }

  .b-link-arrow{
    display:inline-flex; align-items:center; gap: 8px;
    background: transparent; border: 0; padding: 4px 0; cursor: pointer;
    font: 600 13px var(--ods-theme-font-family);
    color: var(--b-deep);
    border-bottom: 1px solid var(--b-deep);
    width: max-content;
  }
  .b-link-arrow i{ font-size: 11px; transition: transform .15s ease-out; }
  .b-link-arrow:hover i{ transform: translateX(3px); }
  .b-link-arrow:hover{ color: var(--b-accent); border-bottom-color: var(--b-accent); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../data.js"></script>
<script type="text/babel" src="shared-bits.jsx"></script>
<script type="text/babel" src="app-b.jsx"></script>
</body>
</html>
