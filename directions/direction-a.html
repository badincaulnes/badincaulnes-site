<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>BadinCaulnes — Direction A · Sportif & dynamique</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../ds/colors_and_type.css" />
<link rel="stylesheet" href="../ds/components.css" />
<link rel="stylesheet" href="../ds/icons.css" />
<link rel="stylesheet" href="../ds/badincaulnes.css" />
<link rel="stylesheet" href="../ds/brand.css" />
<style>
  /* Direction A — bold, contrasted, sportif, palette BadinCaulnes */
  :root{
    --a-bg: #fff;
    --a-ink: var(--bc-navy-deep);
    --a-deep: var(--bc-navy);            /* masterbrand navy */
    --a-deeper: var(--bc-navy-deep);     /* hero background */
    --a-accent: var(--bc-lime);          /* lime ES */
    --a-accent-2: var(--bc-teal);        /* teal CAUL */
  }
  body{ background: var(--a-bg); color: var(--ods-theme-text-color); }
  .a-app{ width:1440px; }

  /* Top bar */
  .a-topbar{
    display:flex; align-items:center; justify-content:space-between;
    height: 72px; padding: 0 40px;
    background: #fff; border-bottom: 1px solid var(--ods-color-neutral-100);
    position: sticky; top: 0; z-index: 40;
  }
  .a-brand{ display:flex; align-items:center; gap: 12px; cursor: pointer; }
  .a-brand-mark{
    width: 44px; height: 44px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .a-brand-mark img{ width: 100%; height: 100%; object-fit: contain; }
  .a-brand-name{ font-weight: 800; font-size: 18px; color: var(--ods-color-primary-800); letter-spacing: -0.01em; }
  .a-brand-sub { font-size: 12px; color: var(--ods-color-neutral-600); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }

  .a-nav{ display:flex; gap: 4px; }
  .a-nav button{
    border: 0; background: transparent;
    padding: 8px 14px; border-radius: 6px;
    font: 600 14px var(--ods-theme-font-family);
    color: var(--ods-color-neutral-700); cursor: pointer;
    transition: color .15s ease-out, background .15s ease-out;
  }
  .a-nav button:hover{ color: var(--a-deep); background: var(--ods-color-primary-025); }
  .a-nav button[aria-current="page"]{
    color: var(--a-deep);
    box-shadow: inset 0 -2px 0 0 var(--a-deep);
    border-radius: 0;
  }
  .a-cta{ display:flex; align-items:center; gap: 8px; }

  /* Hero — dark, dramatic */
  .a-hero{
    position: relative;
    background: var(--a-deeper);
    color: #fff;
    overflow: hidden;
    padding: 64px 40px 56px;
  }
  .a-hero::before{
    /* layered radial + diagonal grid pattern */
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 78% 12%, rgba(115,227,255,.25) 0%, transparent 38%),
      radial-gradient(circle at 18% 92%, rgba(255,209,36,.18) 0%, transparent 42%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 1px, transparent 1px 28px);
    pointer-events:none;
  }
  .a-hero-inner{ position:relative; z-index:1; display:grid; grid-template-columns: 1fr; align-items:center; max-width: 1100px; margin: 0 auto; }
  .a-hero-col{ max-width: 820px; }
  .a-hero-eyebrow{
    font: 700 12px/1 var(--ods-theme-font-family);
    text-transform: uppercase; letter-spacing: .18em;
    color: var(--a-accent);
    display:inline-flex; align-items:center; gap:10px;
  }
  .a-hero-eyebrow::before{ content:""; width: 28px; height: 2px; background: var(--a-accent); }
  .a-hero h1{
    color: #fff;
    font-size: 76px; line-height: .98; font-weight: 800;
    letter-spacing: -0.028em;
    margin-top: 18px;
  }
  .a-hero h1 .accent{ color: var(--a-accent); }
  .a-hero p.lead{
    color: rgba(255,255,255,.78);
    font-size: 19px; line-height: 1.5;
    margin: 18px 0 28px;
    max-width: 520px;
  }
  .a-hero-ctas{ display:flex; gap: 12px; }
  .a-hero-strap{
    display:flex; gap: 28px; margin-top: 40px;
    padding-top: 24px; border-top: 1px solid rgba(255,255,255,.12);
    max-width: 560px;
  }
  .a-hero-strap .num{ color:#fff; }
  .a-hero-strap .lab{ color: rgba(255,255,255,.6); }

  /* Hero right column — shuttlecock visual */
  .a-shuttle-wrap{ position:relative; height: 380px; display:flex; align-items:center; justify-content:center; }

  /* Section base */
  .a-section{ padding: 72px 40px; }
  .a-section--tight{ padding: 56px 40px; }
  .a-section--alt{ background: var(--ods-color-neutral-025); }
  .a-section-head{ display:flex; align-items:flex-end; justify-content:space-between; gap: 24px; margin-bottom: 32px; }
  .a-section-head h2{ font-size: 40px; letter-spacing: -.02em; }
  .a-section-head .sub{ color: var(--ods-color-neutral-600); max-width: 480px; margin-top: 10px; }

  /* News */
  .a-news-grid{ display:grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 20px; }
  .a-news-card{
    background:#fff; border:1px solid var(--ods-color-neutral-100); border-radius: 12px;
    overflow: hidden; display:flex; flex-direction: column;
    transition: transform .2s ease-out, box-shadow .2s ease-out, border-color .2s ease-out;
  }
  .a-news-card:hover{ transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,14,156,.10); border-color: var(--ods-color-neutral-200); }
  .a-news-card--feature .a-news-img{ height: 280px; }
  .a-news-img{ height: 160px; }
  .a-news-body{ padding: 18px 18px 20px; display:flex; flex-direction: column; gap: 8px; flex: 1; }
  .a-news-meta{ display:flex; align-items:center; gap: 10px; font-size: 12px; color: var(--ods-color-neutral-600); }
  .a-news-title{ font-weight: 800; color: var(--ods-color-primary-800); font-size: 18px; line-height: 1.28; letter-spacing: -.01em; }
  .a-news-card--feature .a-news-title{ font-size: 26px; line-height: 1.18; }
  .a-news-excerpt{ font-size: 14px; line-height: 1.5; color: var(--ods-theme-text-color); }
  .a-news-foot{ display:flex; align-items:center; justify-content:space-between; padding-top: 8px; margin-top: auto; font-size: 12px; color: var(--ods-color-neutral-600); }

  /* Events */
  .a-events{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .a-event{
    background:#fff; border:1px solid var(--ods-color-neutral-100); border-radius:12px;
    padding: 22px; display:flex; gap: 18px; align-items:flex-start;
    transition: border-color .2s, box-shadow .2s;
  }
  .a-event:hover{ border-color: var(--ods-color-primary-300); box-shadow: 0 4px 16px rgba(0,14,156,.08); }
  .a-event__date{
    flex: 0 0 auto; width: 72px; text-align:center;
    background: var(--a-deep); color:#fff; border-radius: 8px;
    padding: 10px 4px; line-height: 1;
    box-shadow: inset 0 -3px 0 0 rgba(187,211,102,.5);
  }
  .a-event__date .d{ font-size: 30px; font-weight: 800; letter-spacing: -.02em; display:block; }
  .a-event__date .m{ font-size: 11px; font-weight: 700; letter-spacing: .14em; margin-top: 4px; color: var(--a-accent); }
  .a-event__body{ flex: 1; display:flex; flex-direction: column; gap: 6px; min-width: 0; }
  .a-event__title{ font-weight: 700; color: var(--ods-color-primary-800); font-size: 17px; line-height: 1.25; }
  .a-event__meta{ font-size: 13px; color: var(--ods-color-neutral-600); display:flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .a-event__meta i{ color: var(--ods-color-neutral-500); }
  .a-event__cap{ display:flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .a-event__cap-row{ display:flex; justify-content: space-between; font-size: 11px; color: var(--ods-color-neutral-600); font-weight: 600; }

  /* Schedule */
  .a-week{
    background:#fff; border:1px solid var(--ods-color-neutral-100); border-radius: 12px; overflow:hidden;
  }
  .a-week table{ width:100%; border-collapse: collapse; }
  .a-week th, .a-week td{ padding: 14px 16px; text-align:left; font-size: 14px; }
  .a-week th{ background: var(--ods-color-neutral-025); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ods-color-neutral-700); font-weight: 700; border-bottom: 1px solid var(--ods-color-neutral-100); }
  .a-week td{ border-bottom: 1px solid var(--ods-color-neutral-050); color: var(--ods-color-neutral-800); }
  .a-week tr:last-child td{ border-bottom: 0; }
  .a-week td.day{ font-weight: 700; color: var(--a-deep); }
  .a-week td.time{ font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ods-color-primary-800); font-family: var(--ods-theme-font-family-code); font-size: 13px; }

  /* Pricing */
  .a-pricing{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .a-price{
    background:#fff; border: 1px solid var(--ods-color-neutral-100); border-radius: 14px;
    padding: 24px; display:flex; flex-direction: column; gap: 14px;
    position: relative;
  }
  .a-price--featured{
    background: var(--a-deeper); color: #fff; border-color: transparent;
    box-shadow: 0 16px 36px rgba(0,14,156,.25);
    transform: translateY(-6px);
  }
  .a-price--featured h3, .a-price--featured .price, .a-price--featured .perk{ color: #fff; }
  .a-price h3{ font-size: 22px; }
  .a-price .sub{ font-size: 13px; color: var(--ods-color-neutral-600); }
  .a-price--featured .sub{ color: rgba(255,255,255,.7); }
  .a-price .price{ font-size: 44px; font-weight: 800; letter-spacing: -.02em; line-height: 1; color: var(--ods-color-primary-800); }
  .a-price .price small{ font-size: 14px; font-weight: 600; color: var(--ods-color-neutral-500); letter-spacing: 0; }
  .a-price--featured .price small{ color: rgba(255,255,255,.65); }
  .a-price .perk{ display:flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.4; color: var(--ods-theme-text-color); }
  .a-price--featured .perk{ color: rgba(255,255,255,.88); }
  .a-price .perk i{ color: var(--ods-color-success-500); font-size: 12px; margin-top: 4px; }
  .a-price--featured .perk i{ color: var(--a-accent); }
  .a-price .badge-feat{ position:absolute; top:-10px; right: 18px; background: var(--a-accent); color: var(--ods-color-primary-900); font: 700 11px var(--ods-theme-font-family); padding: 4px 10px; border-radius: 4px; letter-spacing: .08em; text-transform: uppercase; }

  /* Team */
  .a-team-grid{ display:grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .a-team-card{ background: #fff; border: 1px solid var(--ods-color-neutral-100); border-radius: 12px; padding: 16px; text-align: center; }
  .a-team-av{
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--bc-teal); color: #fff;
    display:flex; align-items:center; justify-content:center;
    font: 800 22px var(--ods-theme-font-family);
    margin: 4px auto 12px;
    box-shadow: inset 0 -3px 0 rgba(7,50,76,.25);
  }
  .a-team-name{ font-weight: 700; color: var(--ods-color-primary-800); font-size: 14px; }
  .a-team-role{ font-size: 12px; color: var(--ods-color-neutral-600); margin-top: 2px; }

  /* Gallery */
  .a-gallery{ display:grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 220px; gap: 12px; }
  .a-gallery .bc-photo:nth-child(1){ grid-row: span 2; }
  .a-gallery .bc-photo:nth-child(5){ grid-column: span 2; }

  /* Contact */
  .a-contact{ display:grid; grid-template-columns: 1.2fr 1fr; gap: 32px; }
  .a-contact-map{
    height: 360px; border-radius: 12px; overflow: hidden; position: relative;
    background:
      radial-gradient(circle at 30% 50%, rgba(0,80,215,.16) 0%, transparent 40%),
      linear-gradient(160deg, #e6faff 0%, #f9f9f9 60%, #ececec 100%);
    border: 1px solid var(--ods-color-neutral-100);
  }
  .a-map-grid{
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(0,14,156,.08) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(0,14,156,.08) 39px 40px);
  }
  .a-map-road{ position:absolute; }
  .a-map-pin{
    position: absolute; left: 48%; top: 52%;
    width: 32px; height: 40px;
    color: var(--ods-color-critical-500);
    transform: translate(-50%, -100%);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.25));
  }
  .a-contact-info{ display:flex; flex-direction: column; gap: 14px; }
  .a-info-row{
    display:flex; gap: 14px; align-items: flex-start;
    padding: 14px 16px;
    background: #fff; border: 1px solid var(--ods-color-neutral-100); border-radius: 10px;
  }
  .a-info-row > .ods-icon{ font-size: 20px; color: var(--a-deep); margin-top: 2px; flex-shrink: 0; }
  .a-info-row strong{ display:block; font-weight: 700; color: var(--ods-color-primary-800); margin-bottom: 2px; font-size: 14px; }
  .a-info-row span{ font-size: 13px; color: var(--ods-color-neutral-700); line-height: 1.4; }

  /* Admin */
  .a-admin-shell{ display:grid; grid-template-columns: 260px 1fr; gap: 28px; }
  .a-admin-side{
    background:#fff; border: 1px solid var(--ods-color-neutral-100); border-radius: 12px;
    padding: 14px;
  }
  .a-admin-side h4{ font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--ods-color-neutral-500); padding: 8px 8px 6px; font-weight: 700; }
  .a-admin-side button{
    display:flex; align-items:center; gap: 10px; width:100%;
    padding: 10px 12px; border-radius: 8px; border:0; background: transparent;
    text-align:left; font: 600 14px var(--ods-theme-font-family); color: var(--ods-color-neutral-700); cursor:pointer;
  }
  .a-admin-side button.is-active{ background: var(--ods-color-primary-050); color: var(--a-deep); }
  .a-admin-side button:hover{ background: var(--ods-color-neutral-050); color: var(--a-deep); }
  .a-admin-main{
    background:#fff; border:1px solid var(--ods-color-neutral-100); border-radius: 12px;
    padding: 28px;
  }
  .a-formgrid{ display:grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .a-formgrid .full{ grid-column: 1 / -1; }

  /* Footer */
  .a-footer{
    background: var(--a-deeper); color: rgba(255,255,255,.7);
    padding: 56px 40px 24px;
  }
  .a-footer h5{ color:#fff; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 14px; }
  .a-footer a{ color: rgba(255,255,255,.7); text-decoration: none; font-weight: 500; }
  .a-footer a:hover{ color: var(--a-accent); }
  .a-footer__grid{ display:grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr; gap: 32px; padding-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .a-footer__strip{ display:flex; justify-content: space-between; padding-top: 18px; font-size: 12px; color: rgba(255,255,255,.5); }

  /* Misc */
  .a-chip{
    display:inline-flex; align-items:center; gap:6px;
    padding: 4px 10px; border-radius: 999px;
    font: 700 11px var(--ods-theme-font-family);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .a-link-arrow{
    display:inline-flex; align-items:center; gap: 6px;
    font: 700 13px var(--ods-theme-font-family);
    color: var(--a-deep); cursor: pointer;
    background: transparent; border: 0; padding: 0;
  }
  .a-link-arrow:hover{ color: var(--ods-color-primary-600); }
  .a-link-arrow i{ font-size: 12px; transition: transform .15s ease-out; }
  .a-link-arrow:hover i{ transform: translateX(3px); }

  /* Hero illustration container */
  .a-shuttle-svg{ width: 360px; height: 360px; }
  .a-hero-eyebrow{ color: var(--a-accent); }
  .a-hero-eyebrow::before{ background: var(--a-accent); }

  /* Page content wrappers */
  .a-page-hero{
    background: var(--a-deeper); color:#fff; padding: 64px 40px 56px; position:relative; overflow:hidden;
  }
  .a-page-hero::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 92% 0%, rgba(115,227,255,.22) 0%, transparent 40%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.04) 0 1px, transparent 1px 28px);
    pointer-events:none;
  }
  .a-page-hero h1{ color:#fff; font-size: 56px; letter-spacing: -.02em; position:relative; }
  .a-page-hero p{ color: rgba(255,255,255,.78); margin-top: 14px; font-size: 17px; max-width: 600px; position:relative; }
  .a-page-hero .crumb{ font-size: 12px; color: var(--a-accent); letter-spacing: .14em; text-transform: uppercase; font-weight: 700; position:relative; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../data.js"></script>
<script src="../content-loader.js"></script>
<script type="text/babel" src="shared-bits.jsx"></script>
<script type="text/babel" src="app-a.jsx"></script>
</body>
</html>
