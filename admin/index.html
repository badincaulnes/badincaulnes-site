<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>BadinCaulnes — Espace bureau</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/logo-badincaulnes-256.png">
</head>
<body>
  <!-- Netlify Identity widget — handles login & invitations for the bureau. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS — the actual admin UI. -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Localise the UI in French. -->
  <script>
    // After login, redirect the user back to the admin (not the root site)
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
</body>
</html>
